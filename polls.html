<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Audio Adhyay Polls</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#root{max-width:640px;margin:auto;padding:16px}
h2{margin:8px 0 12px;font-size:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header a{color:#fff;border:1px solid #444;border-radius:10px;padding:8px 14px;text-decoration:none;font-size:14px}
input,textarea,button{width:100%;font:inherit;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#111;color:#fff}
textarea{min-height:120px}
button{background:#fff;color:#000;font-weight:700;border:0;cursor:pointer}
button.ghost{background:#000;color:#fff;border:1px solid #444}
button.red{background:#000;color:#ff7b7b;border:1px solid #6a2a2a}
label{display:block;color:#9a9a9a;font-size:14px;margin-top:10px}
.box{border:1px solid #222;border-radius:12px;padding:14px;margin-top:16px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid #444;color:#9a9a9a}
.tag.on{background:#fff;color:#000;border-color:#fff}
.opt{position:relative;border:1px solid #262626;border-radius:10px;margin:8px 0;padding:10px 12px;display:flex;justify-content:space-between;overflow:hidden}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:#ffffff26}
.opt span,.opt b{position:relative}
.row{display:flex;gap:8px}
.row button{margin:8px 0 0}
small{color:#9a9a9a}
#msg{min-height:22px;margin:8px 0;font-size:14px}
.err{color:#ff7b7b}.ok{color:#7bff9a}
</style>
</head>
<body>
<div id="root"><p style="color:#9a9a9a">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
window.onerror=function(m,s,l){document.getElementById('root').innerHTML='<p style="color:#ff7b7b">Error: '+m+' (line '+l+')</p>';};

const SUPABASE_URL = "https://cdcsjurvtukyidjpzvga.supabase.co";
const SUPABASE_KEY = "sb_publishable_k1zEdgsnl4b0nQS0L3lpWQ_ZkrdDwgP"; // public key hi, secret nahi

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const root = document.getElementById('root');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function msg(t, bad) {
  const m = $('#msg');
  if (m) { m.textContent = t; m.className = bad ? 'err' : 'ok'; }
}

async function init() {
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    root.innerHTML = '<h2>Login chahiye</h2><p>Pehle <a style="color:#fff" href="index.html">index.html</a> par admin login karo, phir is page ko dobara kholo.</p>';
    return;
  }
  const ok = await sb.rpc('is_admin');
  if (ok.data !== true) {
    root.innerHTML = '<h2>Access nahi hai</h2><p>Ye account admin nahi hai.</p>';
    return;
  }
  view();
}

async function view(flash, bad) {
  const r = await sb.from('polls').select('id,question,is_active').order('created_at', { ascending: false });
  if (r.error) { root.innerHTML = '<p class="err">' + esc(r.error.message) + '</p>'; return; }
  const polls = r.data || [];
  const res = await Promise.all(polls.map(p => sb.rpc('poll_json', { p_poll: p.id })));

  const cards = polls.map((p, i) => {
    const j = res[i].data || { options: [] };
    const total = j.options.reduce((a, o) => a + o.votes, 0);
    const opts = j.options.map(o => {
      const pct = total ? Math.round(o.votes * 100 / total) : 0;
      return `<div class="opt"><div class="fill" style="width:${pct}%"></div><span>${esc(o.text)}</span><b>${o.votes} (${pct}%)</b></div>`;
    }).join('');
    return `<div class="box">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
        <b>${esc(p.question)}</b><span class="tag ${p.is_active ? 'on' : ''}">${p.is_active ? 'active' : 'closed'}</span>
      </div>
      ${opts}<small>${total} votes</small>
      <div class="row">
        ${p.is_active
          ? `<button class="ghost" onclick="closePoll('${p.id}')">Close poll</button>`
          : `<button onclick="activate('${p.id}')">Make active</button>`}
        <button class="red" onclick="del('${p.id}')">Delete</button>
      </div></div>`;
  }).join('');

  root.innerHTML = `<header><h2>Polls</h2><a href="index.html">Books</a></header>
    <div class="box" style="margin-top:0">
      <b>New poll</b>
      <label>Question</label><input id="q" value="Which audiobook should we add next?">
      <label>Options (ek line me ek book, 2 se 8)</label><textarea id="o"></textarea>
      <small>Sirf wahi books suggest karo jinke distribution rights aap la sako.</small>
      <button onclick="create()">Create poll</button>
    </div>
    <div id="msg"></div>${cards || '<p style="color:#9a9a9a">Abhi koi poll nahi hai.</p>'}`;
  if (flash) msg(flash, bad);
}

async function create() {
  const q = $('#q').value.trim();
  const opts = $('#o').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!q) return msg('Question likho.', 1);
  if (opts.length < 2 || opts.length > 8) return msg('2 se 8 options chahiye.', 1);
  const p = await sb.from('polls').insert({ question: q, is_active: false }).select().single();
  if (p.error) return msg(p.error.message, 1);
  const o = await sb.from('poll_options').insert(opts.map((t, i) => ({ poll_id: p.data.id, text: t, position: i })));
  if (o.error) {
    await sb.from('polls').delete().eq('id', p.data.id);
    return msg(o.error.message, 1);
  }
  view('Poll ban gaya. "Make active" dabao to app me dikhega.');
}

async function activate(id) {
  await sb.from('polls').update({ is_active: false }).eq('is_active', true);
  const r = await sb.from('polls').update({ is_active: true }).eq('id', id);
  view(r.error ? r.error.message : 'Poll active hai, app me dikhega.', !!r.error);
}

async function closePoll(id) {
  const r = await sb.from('polls').update({ is_active: false }).eq('id', id);
  view(r.error ? r.error.message : 'Poll band ho gaya.', !!r.error);
}

async function del(id) {
  if (!confirm('Ye poll aur uske saare votes delete ho jaayenge. Pakka?')) return;
  const r = await sb.from('polls').delete().eq('id', id);
  view(r.error ? r.error.message : 'Poll delete ho gaya.', !!r.error);
}

init();
</script>
</body>
</html>
