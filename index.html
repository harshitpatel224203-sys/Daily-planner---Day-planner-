<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Audio Adhyay Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#root{max-width:640px;margin:auto;padding:16px}
h2{margin:8px 0 12px;font-size:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header button{width:auto;margin:0;padding:8px 14px}
input,select,textarea,button{width:100%;font:inherit;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#111;color:#fff}
textarea{min-height:110px}
button{background:#fff;color:#000;font-weight:700;border:0;cursor:pointer}
button.ghost{background:#000;color:#fff;border:1px solid #444}
button.red{background:#000;color:#ff7b7b;border:1px solid #6a2a2a}
input[type=checkbox]{width:20px;height:20px;margin:2px 10px 0 0;flex:none}
label{display:block;color:#9a9a9a;font-size:14px;margin-top:10px}
.check{display:flex;color:#fff;font-size:15px;margin-top:14px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #1f1f1f;cursor:pointer}
.row .info{flex:1;min-width:0}
.row small{color:#9a9a9a}
.thumb{width:48px;height:68px;border-radius:6px;background:#222 center/cover;flex:none}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid #444;color:#9a9a9a}
.tag.published{background:#fff;color:#000;border-color:#fff}
.ch{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1f1f1f}
.ch .info{flex:1;min-width:0}
.ch button{width:auto;margin:0;padding:6px 12px}
#msg{min-height:22px;margin:8px 0;font-size:14px}
.err{color:#ff7b7b}.ok{color:#7bff9a}
.box{border:1px solid #222;border-radius:12px;padding:12px;margin-top:16px}
</style>
</head>
<body>
<div id="root"><p style="color:#9a9a9a">Loading… agar ye line hamesha dikhe, to JavaScript ya internet block hai.</p></div>
<script>window.onerror=function(m,s,l){var r=document.getElementById("root");if(r)r.innerHTML='<p style="color:#ff7b7b">Error: '+m+' (line '+l+')</p>';};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== SIRF YE DO LINES BADLO (public key hi daalna, service_role/secret NAHI) ======
const SUPABASE_URL = "https://cdcsjurvtukyidjpzvga.supabase.co";
const SUPABASE_KEY = "sb_publishable_k1zEdgsnl4b0nQS0L3lpWQ_ZkrdDwgP";
// ======================================================================================

if (typeof supabase === 'undefined') throw new Error('Supabase library load nahi hui. Internet check karo, ya file ko online host karke kholo.');
const sb = SUPABASE_URL.startsWith('PASTE') ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const root = document.getElementById('root');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ext = f => (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
let cats = [], chList = [];

function msg(t, bad) {
  const m = $('#msg');
  if (m) { m.textContent = t; m.className = bad ? 'err' : 'ok'; }
}
function coverUrl(p) {
  return p ? sb.storage.from('covers').getPublicUrl(p).data.publicUrl : '';
}
function fmt(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

async function init() {
  if (SUPABASE_URL.startsWith('PASTE')) {
    root.innerHTML = '<h2>Setup baaki hai</h2><p>index.html ke upar wali 2 lines me apna Project URL aur public key daalo.</p>';
    return;
  }
  const { data } = await sb.auth.getSession();
  data.session ? guard() : loginView();
}

function loginView() {
  root.innerHTML = `<h2>Audio Adhyay Admin</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button id="go">Log in</button><div id="msg"></div>`;
  $('#go').onclick = async () => {
    msg('Logging in…');
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) return msg(error.message, 1);
    guard();
  };
}

async function guard() {
  const { data, error } = await sb.rpc('is_admin');
  if (error || data !== true) {
    await sb.auth.signOut();
    loginView();
    return msg('This account is not an admin.', 1);
  }
  listView();
}

async function logout() { await sb.auth.signOut(); loginView(); }

async function listView() {
  const [c, b] = await Promise.all([
    sb.from('categories').select('*').order('name'),
    sb.from('books').select('*').order('created_at', { ascending: false })
  ]);
  cats = c.data || [];
  const rows = (b.data || []).map(x => `
    <div class="row" onclick="editView('${x.id}')">
      <div class="thumb" style="background-image:url('${esc(coverUrl(x.cover_path))}')"></div>
      <div class="info"><b>${esc(x.title)}</b><br><small>${esc(x.author)}</small></div>
      <span class="tag ${x.status}">${x.status}</span>
    </div>`).join('');
  root.innerHTML = `<header><h2>Books</h2><button class="ghost" onclick="logout()">Log out</button></header>
    <button onclick="editView()">Add book</button>
    <button class="ghost" onclick="addCat()">Add category</button>
    <div id="msg"></div>
    ${rows || '<p style="color:#9a9a9a">No books yet. Tap “Add book” to start.</p>'}`;
}

async function addCat() {
  const name = (prompt('Category name') || '').trim();
  if (!name) return;
  const { error } = await sb.from('categories').insert({ name });
  await listView();
  msg(error ? error.message : 'Category added', !!error);
}

async function editView(id) {
  let b = { title: '', author: '', description: '', category_id: '', rights_basis: '', rights_confirmed: false, status: 'draft', cover_path: null };
  chList = [];
  if (id) {
    b = (await sb.from('books').select('*').eq('id', id).single()).data;
    chList = (await sb.from('chapters').select('*').eq('book_id', id).order('position')).data || [];
  }
  const catOpts = '<option value="">No category</option>' + cats.map(c => `<option value="${c.id}" ${c.id === b.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const rb = [['', 'Select…'], ['public_domain', 'Public domain'], ['own_recording', 'My own recording'], ['licensed', 'Licensed to me']]
    .map(o => `<option value="${o[0]}" ${o[0] === (b.rights_basis || '') ? 'selected' : ''}>${o[1]}</option>`).join('');
  const chHtml = chList.map((c, i) => `<div class="ch"><div class="info"><b>${c.position}. ${esc(c.title)}</b><br><small>${fmt(c.duration_sec)}</small></div><button class="red" onclick="delCh(${i},'${id}')">Delete</button></div>`).join('');

  root.innerHTML = `<header><h2>${id ? 'Edit book' : 'New book'}</h2><button class="ghost" onclick="listView()">Back</button></header>
  <span class="tag ${b.status}">${b.status}</span>
  <label>Title</label><input id="t" value="${esc(b.title)}">
  <label>Author</label><input id="a" value="${esc(b.author)}">
  <label>Description</label><textarea id="d">${esc(b.description)}</textarea>
  <label>Category</label><select id="c">${catOpts}</select>
  <label>Cover image (JPG or PNG)</label>
  ${b.cover_path ? `<div class="thumb" style="width:90px;height:130px;background-image:url('${esc(coverUrl(b.cover_path))}')"></div>` : ''}
  <input id="cv" type="file" accept="image/*">
  <div class="box"><b>Rights</b>
    <label>I distribute this audiobook as</label><select id="rb">${rb}</select>
    <label class="check"><input id="rc" type="checkbox" ${b.rights_confirmed ? 'checked' : ''}>I confirm I hold the rights to distribute this audiobook.</label>
  </div>
  <div id="msg"></div>
  <button onclick="save('${id || ''}','${b.status}')">${id ? 'Save changes' : 'Save as draft'}</button>
  ${id ? (b.status === 'published'
      ? `<button class="ghost" onclick="save('${id}','draft')">Unpublish</button>`
      : `<button class="ghost" onclick="save('${id}','published')">Publish</button>`) : ''}
  ${id ? `<div class="box"><b>Chapters</b>${chHtml || '<p style="color:#9a9a9a">No chapters yet.</p>'}
    <label>Chapter title</label><input id="ct">
    <label>Audio file (MP3 or M4A)</label><input id="au" type="file" accept="audio/*">
    <button class="ghost" onclick="addCh('${id}')">Upload chapter</button></div>
  <button class="red" style="margin-top:24px" onclick="delBook('${id}')">Delete book</button>` : '<p style="color:#9a9a9a">Save the draft first, then add chapters.</p>'}`;
}

async function save(id, status) {
  const f = {
    title: $('#t').value.trim(), author: $('#a').value.trim(), description: $('#d').value,
    category_id: $('#c').value || null, rights_basis: $('#rb').value || null,
    rights_confirmed: $('#rc').checked, updated_at: new Date().toISOString()
  };
  if (!f.title || !f.author) return msg('Title and author are required.', 1);
  if (status === 'published') {
    if (!f.rights_basis || !f.rights_confirmed) return msg('Select the rights basis and confirm you hold the rights before publishing.', 1);
    const n = await sb.from('chapters').select('id', { count: 'exact', head: true }).eq('book_id', id);
    if (!n.count) return msg('Add at least one chapter before publishing.', 1);
  }
  msg('Saving…');
  let bid = id;
  if (id) {
    const { error } = await sb.from('books').update({ ...f, status }).eq('id', id);
    if (error) return msg(error.message, 1);
  } else {
    const { data, error } = await sb.from('books').insert({ ...f, status: 'draft' }).select().single();
    if (error) return msg(error.message, 1);
    bid = data.id;
  }
  const file = $('#cv').files[0];
  if (file) {
    const path = `${bid}/cover-${Date.now()}.${ext(file)}`;
    const up = await sb.storage.from('covers').upload(path, file, { contentType: file.type });
    if (up.error) return msg('Cover upload failed: ' + up.error.message, 1);
    const old = id ? (await sb.from('books').select('cover_path').eq('id', bid).single()).data : null;
    await sb.from('books').update({ cover_path: path }).eq('id', bid);
    if (old && old.cover_path) await sb.storage.from('covers').remove([old.cover_path]);
  }
  await editView(bid);
  msg(status === 'published' ? 'Published' : (id ? 'Saved' : 'Draft saved'));
}

function duration(f) {
  return new Promise(r => {
    const a = new Audio(); a.preload = 'metadata';
    const u = URL.createObjectURL(f);
    a.onloadedmetadata = () => { r(Math.round(a.duration) || null); URL.revokeObjectURL(u); };
    a.onerror = () => r(null);
    a.src = u;
  });
}

async function addCh(bid) {
  const f = $('#au').files[0], t = $('#ct').value.trim();
  if (!t || !f) return msg('Enter a chapter title and choose an audio file.', 1);
  const last = (await sb.from('chapters').select('position').eq('book_id', bid).order('position', { ascending: false }).limit(1)).data;
  const pos = (last && last[0] ? last[0].position : 0) + 1;
  const path = `${bid}/${pos}-${Date.now()}.${ext(f)}`;
  msg('Uploading… keep this page open.');
  const up = await sb.storage.from('audio').upload(path, f, { contentType: f.type || 'audio/mpeg' });
  if (up.error) return msg('Upload failed: ' + up.error.message, 1);
  const dur = await duration(f);
  const { error } = await sb.from('chapters').insert({ book_id: bid, title: t, position: pos, audio_path: path, duration_sec: dur });
  if (error) { await sb.storage.from('audio').remove([path]); return msg(error.message, 1); }
  await editView(bid);
  msg('Chapter added');
}

async function delCh(i, bid) {
  const c = chList[i];
  if (!confirm('Delete chapter “' + c.title + '”?')) return;
  await sb.storage.from('audio').remove([c.audio_path]);
  const { error } = await sb.from('chapters').delete().eq('id', c.id);
  await editView(bid);
  msg(error ? error.message : 'Chapter deleted', !!error);
}

async function delBook(id) {
  if (!confirm('Delete this book, its cover and all chapters? This cannot be undone.')) return;
  const b = (await sb.from('books').select('cover_path').eq('id', id).single()).data;
  const ch = (await sb.from('chapters').select('audio_path').eq('book_id', id)).data || [];
  if (ch.length) await sb.storage.from('audio').remove(ch.map(c => c.audio_path));
  if (b && b.cover_path) await sb.storage.from('covers').remove([b.cover_path]);
  const { error } = await sb.from('books').delete().eq('id', id);
  await listView();
  msg(error ? error.message : 'Book deleted', !!error);
}

init();
</script>
</body>
</html>
